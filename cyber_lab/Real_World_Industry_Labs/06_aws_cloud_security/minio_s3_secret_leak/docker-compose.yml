services:
  minio:
    image: vulhub/minio:2023-02-27T18-10-45Z
    container_name: cyberlab_realworld_minio_leak
    ports:
      - "9000:9000"
      - "9002:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=SuperSecretAdminPassword123!
    command: server /data --console-address ":9001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M
