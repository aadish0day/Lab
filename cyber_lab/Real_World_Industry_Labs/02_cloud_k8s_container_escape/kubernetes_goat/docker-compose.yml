services:
  k8s-goat:
    image: rancher/k3s:v1.28.2-k3s1
    pull_policy: missing
    container_name: cyberlab_k8s_goat
    privileged: true
    restart: unless-stopped
    ports:
      - "8105:80"        # Ingress HTTP / Scenario Web Access
      - "6443:6443"      # Kubernetes API Server
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    volumes:
      - k3s-goat-data:/var/lib/rancher/k3s
      - ./manifests:/var/lib/rancher/k3s/server/manifests:ro
      - ./output:/output
    tmpfs:
      - /run
      - /var/run

volumes:
  k3s-goat-data:
