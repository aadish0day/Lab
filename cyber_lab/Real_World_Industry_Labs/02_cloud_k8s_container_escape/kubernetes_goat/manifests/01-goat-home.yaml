apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-goat-home
  namespace: default
  labels:
    app: kubernetes-goat-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-goat-home
  template:
    metadata:
      labels:
        app: kubernetes-goat-home
    spec:
      containers:
        - name: goat-home
          image: madhuakula/k8s-goat-home:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-goat-home-svc
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: kubernetes-goat-home
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-goat-ingress
  namespace: default
  annotations:
    ingress.class: "traefik"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubernetes-goat-home-svc
                port:
                  number: 80
