version: "3.8"

services:
  grafana:
    image: vulhub/grafana:8.2.6
    pull_policy: missing
    container_name: cyberlab_grafana
    restart: unless-stopped
    ports:
      - "8182:3000"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=grafana-traversal"
