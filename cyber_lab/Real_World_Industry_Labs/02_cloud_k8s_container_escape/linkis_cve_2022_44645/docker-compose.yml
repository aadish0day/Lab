services:
  mysql:
    image: mysql:5.7
    pull_policy: missing
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=linkis

  web:
    image: vulhub/linkis:1.3.0
    pull_policy: missing
    depends_on:
      - mysql
    ports:
      - "8383:9001"
      - "20303:20303"
      - "5005:5005"
