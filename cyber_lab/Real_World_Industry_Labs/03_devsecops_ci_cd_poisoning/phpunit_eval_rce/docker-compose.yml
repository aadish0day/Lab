version: "3.8"

services:
  phpunit:
    image: vulhub/phpunit:5.6.2
    pull_policy: missing
    container_name: cyberlab_phpunit
    restart: unless-stopped
    ports:
      - "8188:80"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=phpunit-eval-rce"
