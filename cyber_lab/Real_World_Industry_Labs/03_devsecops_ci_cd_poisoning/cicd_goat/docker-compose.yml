networks:
  cicd-net:
    driver: bridge

services:
  # Primary Challenge Platform: CI/CD Goat CTFd Portal
  # Accessible at http://localhost:8112
  ctfd:
    image: cidersecurity/goat-ctfd:latest
    pull_policy: missing
    container_name: cyberlab_cicd_ctfd
    restart: unless-stopped
    ports:
      - "8112:8000"
    networks:
      - cicd-net
    environment:
      - REVERSE_PROXY=false

  # Optional Full Infrastructure Profile: Gitea VCS
  gitea:
    image: cidersecurity/goat-gitea:latest
    pull_policy: missing
    container_name: cyberlab_cicd_gitea
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "3004:3000"
      - "2224:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
    networks:
      - cicd-net

  # Optional Full Infrastructure Profile: Jenkins Master Server
  jenkins:
    image: cidersecurity/goat-jenkins-server:latest
    pull_policy: missing
    container_name: cyberlab_cicd_jenkins
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "8113:8080"
      - "50001:50000"
    networks:
      - cicd-net

  # Optional Full Infrastructure Profile: Jenkins Runner Agent
  jenkins-agent:
    image: cidersecurity/goat-jenkins-agent:latest
    pull_policy: missing
    container_name: cyberlab_cicd_jenkins_agent
    restart: unless-stopped
    profiles:
      - full
    networks:
      - cicd-net
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=ssh-rsa 
