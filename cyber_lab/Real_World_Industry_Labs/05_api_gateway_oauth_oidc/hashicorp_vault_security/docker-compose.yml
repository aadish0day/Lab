services:
  vault:
    image: hashicorp/vault:latest
    pull_policy: missing
    container_name: cyberlab_vault_security
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=cyberlab_vault_root_token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - ./policies:/vault/policies:ro
      - ./scripts:/vault/scripts:ro
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 5
