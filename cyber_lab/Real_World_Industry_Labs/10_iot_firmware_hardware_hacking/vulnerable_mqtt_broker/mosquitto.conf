# ==============================================================================
# Insecure Default Mosquitto MQTT Configuration (Vulnerable by Design)
# ==============================================================================

# Plaintext unauthenticated TCP listener
listener 1883 0.0.0.0
allow_anonymous true

# Plaintext WebSocket listener for browser IoT dashboards
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Verbose logging to observe injected topics and clients
log_dest stdout
log_type all
