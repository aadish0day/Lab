services:
  sliver-c2:
    image: bishopfox/sliver:latest
    pull_policy: missing
    container_name: cyberlab_realworld_sliver_c2
    ports:
      - "8889:8888"
      - "31337:31337"
    volumes:
      - sliver_data:/root/.sliver
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  sliver_data:
