services:
  gophish:
    image: gophish/gophish:latest
    pull_policy: missing
    container_name: cyberlab_realworld_gophish
    ports:
      - "3333:3333"
      - "8092:80"
    environment:
      - DB_FILE_PATH=data/gophish.db
    volumes:
      - ./data:/opt/gophish/data
    restart: unless-stopped
