services:
  cowrie:
    image: cowrie/cowrie:latest
    pull_policy: missing
    container_name: cyberlab_cowrie_honeypot
    restart: unless-stopped
    ports:
      - "2223:2222"       # Cowrie SSH Honeypot
      - "2324:2323"       # Cowrie Telnet Honeypot
    environment:
      - COWRIE_TELNET_ENABLED=yes
    volumes:
      - cowrie_var:/cowrie/cowrie-git/var

volumes:
  cowrie_var:
