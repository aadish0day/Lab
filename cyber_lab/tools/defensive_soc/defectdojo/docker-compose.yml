services:
  defectdojo-django:
    image: defectdojo/defectdojo-django:latest
    pull_policy: missing
    container_name: cyberlab_defectdojo_server
    restart: unless-stopped
    ports:
      - "8098:8080"
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - DD_DATABASE_URL=postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
      - DD_CELERY_BROKER_URL=redis://redis:6379/0
      - DD_CACHE_URL=redis://redis:6379/1
      - DD_DATABASE_HOST=postgres
      - DD_DATABASE_PORT=5432
      - DD_DATABASE_NAME=defectdojo
      - DD_DATABASE_USER=defectdojo
      - DD_DATABASE_PASSWORD=defectdojo
      - DD_SECRET_KEY=cyberlab_insecure_threat_intel_key
      - DD_CREDENTIAL_AES_256_KEY=cyberlab_insecure_threat_intel_aes256_key
      - DD_DEBUG=True
      - DD_ALLOWED_HOSTS=*
      - DD_UWSGI_MODE=http-socket
      - DD_UWSGI_ENDPOINT=0.0.0.0:8080
    volumes:
      - defectdojo_media:/app/media

  celery-worker:
    image: defectdojo/defectdojo-django:latest
    pull_policy: missing
    container_name: cyberlab_defectdojo_celery_worker
    restart: unless-stopped
    entrypoint:
      [
        "/wait-for-it.sh",
        "postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-celery-worker.sh",
      ]
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - DD_DATABASE_URL=postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
      - DD_CELERY_BROKER_URL=redis://redis:6379/0
      - DD_CACHE_URL=redis://redis:6379/1
      - DD_DATABASE_HOST=postgres
      - DD_DATABASE_PORT=5432
      - DD_DATABASE_NAME=defectdojo
      - DD_DATABASE_USER=defectdojo
      - DD_DATABASE_PASSWORD=defectdojo
      - DD_SECRET_KEY=cyberlab_insecure_threat_intel_key
      - DD_CREDENTIAL_AES_256_KEY=cyberlab_insecure_threat_intel_aes256_key
    volumes:
      - defectdojo_media:/app/media

  initializer:
    image: defectdojo/defectdojo-django:latest
    pull_policy: missing
    container_name: cyberlab_defectdojo_initializer
    restart: "no"
    entrypoint:
      [
        "/wait-for-it.sh",
        "postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-initializer.sh",
      ]
    depends_on:
      postgres:
        condition: service_started
      permissions:
        condition: service_completed_successfully
    environment:
      - DD_DATABASE_URL=postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
      - DD_CELERY_BROKER_URL=redis://redis:6379/0
      - DD_CACHE_URL=redis://redis:6379/1
      - DD_DATABASE_HOST=postgres
      - DD_DATABASE_PORT=5432
      - DD_DATABASE_NAME=defectdojo
      - DD_DATABASE_USER=defectdojo
      - DD_DATABASE_PASSWORD=defectdojo
      - DD_ADMIN_USER=admin
      - DD_ADMIN_PASSWORD=admin
      - DD_ADMIN_MAIL=admin@defectdojo.local
      - DD_ADMIN_FIRST_NAME=Admin
      - DD_ADMIN_LAST_NAME=User
      - DD_INITIALIZE=true
      - DD_SECRET_KEY=cyberlab_insecure_threat_intel_key
      - DD_CREDENTIAL_AES_256_KEY=cyberlab_insecure_threat_intel_aes256_key
      - DD_DATABASE_READINESS_TIMEOUT=60
    volumes:
      - defectdojo_media:/app/media

  postgres:
    image: postgres:15-alpine
    pull_policy: missing
    container_name: cyberlab_defectdojo_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=defectdojo
      - POSTGRES_USER=defectdojo
      - POSTGRES_PASSWORD=defectdojo
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    pull_policy: missing
    container_name: cyberlab_defectdojo_redis
    restart: unless-stopped
    volumes:
      - defectdojo_redis:/data

  permissions:
    image: alpine:latest
    pull_policy: missing
    container_name: cyberlab_defectdojo_permissions
    restart: "no"
    command: >
      sh -c "mkdir -p /app/media && chown -R 1001:1001 /app/media && chmod -R 775 /app/media"
    volumes:
      - defectdojo_media:/app/media

volumes:
  defectdojo_postgres:
  defectdojo_redis:
  defectdojo_media:
