services:
  pipeline-runner:
    image: python:3.11-alpine
    pull_policy: missing
    container_name: cyberlab_devsecops_pipeline
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ./target:/target
      - ./reports:/reports
      - /var/run/docker.sock:/var/run/docker.sock
    stdin_open: true
    tty: true
    command: >
      sh -c "apk add --no-cache curl jq bash git docker-cli &&
             echo 'DevSecOps Pipeline Runner Container Ready. Run ./run_pipeline.sh to execute scans.' &&
             tail -f /dev/null"

  vulnerable-target:
    image: python:3.9-alpine
    pull_policy: missing
    container_name: cyberlab_pipeline_target
    restart: unless-stopped
    ports:
      - "8102:5000"
    volumes:
      - ./target:/app
    working_dir: /app
    command: >
      sh -c "pip install flask==2.0.1 pyyaml==5.1 requests==2.19.1 urllib3==1.24.2 &&
             python app.py"

  semgrep-scanner:
    image: semgrep/semgrep:latest
    pull_policy: missing
    container_name: cyberlab_semgrep_scanner
    volumes:
      - ./target:/src:ro
      - ./reports:/reports
    profiles: ["manual"]
    command: semgrep scan --config auto --json -o /reports/semgrep-report.json /src

  trivy-scanner:
    image: aquasec/trivy:latest
    pull_policy: missing
    container_name: cyberlab_trivy_scanner
    volumes:
      - ./target:/src:ro
      - ./reports:/reports
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["manual"]
    command: fs --format json -o /reports/trivy-report.json /src

  gitleaks-scanner:
    image: zricethezav/gitleaks:latest
    pull_policy: missing
    container_name: cyberlab_gitleaks_scanner
    volumes:
      - ./target:/src:ro
      - ./reports:/reports
    profiles: ["manual"]
    command: detect --source=/src --report-format=json --report-path=/reports/gitleaks-report.json --no-git --verbose
