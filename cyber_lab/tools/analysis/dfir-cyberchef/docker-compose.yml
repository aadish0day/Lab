services:
  cyberchef:
    image: mpepping/cyberchef:latest
    pull_policy: missing
    container_name: cyberlab_dfir_cyberchef
    restart: unless-stopped
    ports:
      - "8106:80" # CyberChef Web Application

  volatility:
    image: cincan/volatility3:latest
    pull_policy: missing
    container_name: cyberlab_dfir_volatility
    restart: unless-stopped
    stdin_open: true
    tty: true
    working_dir: /workspace
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./dumps:/dumps
      - ./rules:/rules
      - ./workspace:/workspace
