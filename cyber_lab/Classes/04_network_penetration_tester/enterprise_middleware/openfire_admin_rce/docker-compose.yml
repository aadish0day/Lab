version: "3.8"

services:
  openfire:
    image: vulhub/openfire:4.7.4
    pull_policy: missing
    container_name: cyberlab_openfire
    restart: unless-stopped
    ports:
      - "8185:9090"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=openfire-rce"
