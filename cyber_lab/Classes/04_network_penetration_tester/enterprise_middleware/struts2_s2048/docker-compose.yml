version: "3.8"

services:
  struts2_s2048:
    image: vulhub/struts2:2.3.32-showcase
    container_name: cyberlab_struts2_s2048
    restart: unless-stopped
    ports:
      - "8209:8080"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=struts2-s2048"
