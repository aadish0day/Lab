version: "3.8"

services:
  weblogic:
    image: vulhub/weblogic:12.2.1.3-2018
    pull_policy: missing
    container_name: cyberlab_weblogic_14882
    restart: unless-stopped
    ports:
      - "8203:7001"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=weblogic-console-rce"
