version: "3.8"

services:
  supervisor:
    image: vulhub/supervisor:3.3.2
    container_name: cyberlab_supervisor
    restart: unless-stopped
    ports:
      - "8191:9001"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=supervisor-rce"
