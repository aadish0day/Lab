version: "3.8"

services:
  struts2_s2057:
    image: vulhub/struts2:2.3.34-showcase
    pull_policy: missing
    container_name: cyberlab_struts2_s2057
    restart: unless-stopped
    ports:
      - "8196:8080"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=struts2-s2057"
