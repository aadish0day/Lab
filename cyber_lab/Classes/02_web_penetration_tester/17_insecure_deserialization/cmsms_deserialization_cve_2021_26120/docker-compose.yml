services:
  cmsms:
    image: vulhub/cmsms:2.2.9.1
    pull_policy: missing
    container_name: cyberlab_02_cmsms_deser_app
    ports:
      - "8260:80"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: mysql:5.7
    pull_policy: missing
    container_name: cyberlab_02_cmsms_deser_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=cmsms
    volumes:
      - cmsms_deser_db_data:/var/lib/mysql

volumes:
  cmsms_deser_db_data:
