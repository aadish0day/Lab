version: "3.8"

services:
  xstream:
    image: vulhub/xstream:1.4.16
    pull_policy: missing
    container_name: cyberlab_xstream
    restart: unless-stopped
    ports:
      - "8202:8080"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=xstream-deserialization-rce"
