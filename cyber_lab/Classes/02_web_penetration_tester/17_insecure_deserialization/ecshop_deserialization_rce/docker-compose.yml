services:
  ecshop:
    image: vulhub/ecshop:2.7.3
    pull_policy: missing
    container_name: cyberlab_02_ecshop_deserialization
    ports:
      - "8172:80"
    restart: unless-stopped
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          memory: 300M

  mysql:
    image: mysql:5.5
    pull_policy: missing
    container_name: cyberlab_02_ecshop_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ecshop_db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  ecshop_db_data:
