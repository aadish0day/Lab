global
    maxconn 256
    log stdout format raw local0 debug

defaults
    log global
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout http-request 10000ms
    timeout http-keep-alive 30000ms

frontend http_front
    bind *:80
    # Front-end ACL: block direct public access to /admin
    acl is_admin path_beg /admin
    http-request deny if is_admin
    default_backend http_back

backend http_back
    # Enable aggressive HTTP connection reuse for backend requests
    http-reuse always
    server backend_srv backend:8000 check
