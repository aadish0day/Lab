services:
  solr:
    image: vulhub/solr:8.8.1
    pull_policy: missing
    container_name: cyberlab_02_solr_streaming
    restart: unless-stopped
    ports:
      - "8217:8983"
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=solr-streaming-fileread"
