services:
  adminer:
    image: vulhub/adminer:4.6.2
    pull_policy: missing
    container_name: cyberlab_02_adminer_fileread
    restart: unless-stopped
    ports:
      - "8189:80"
    deploy:
      resources:
        limits:
          memory: 400M
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=adminer-arbitrary-file-read"
