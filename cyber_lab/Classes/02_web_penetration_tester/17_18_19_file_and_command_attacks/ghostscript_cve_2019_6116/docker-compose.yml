services:
  ghostscript:
    image: vulhub/imagemagick:7.0.8-27-php
    pull_policy: missing
    container_name: cyberlab_02_ghostscript_6116
    restart: unless-stopped
    command: php -t /var/www/html -S 0.0.0.0:8080
    volumes:
      - ./index.php:/var/www/html/index.php
    ports:
      - "8222:8080"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=ghostscript-policy-bypass"
