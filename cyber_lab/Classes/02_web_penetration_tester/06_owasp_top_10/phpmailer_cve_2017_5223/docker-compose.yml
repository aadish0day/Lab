version: "3.8"

services:
  phpmailer:
    image: vulhub/phpmailer:5.2.20
    pull_policy: missing
    container_name: cyberlab_phpmailer_5223
    restart: unless-stopped
    ports:
      - "8218:80"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=phpmailer-file-disclosure"
