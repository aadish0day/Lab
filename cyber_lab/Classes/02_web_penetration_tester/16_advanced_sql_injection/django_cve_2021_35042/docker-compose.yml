services:
  django:
    container_name: cyberlab_02_django_35042_app
    image: vulhub/django:3.2.4
    pull_policy: missing
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8237:8000"
    depends_on:
      - db
    command: bash /app/docker-entrypoint.sh

  db:
    container_name: cyberlab_02_django_35042_db
    image: mysql:5.7
    pull_policy: missing
    environment:
      - MYSQL_ROOT_PASSWORD=mysql
      - MYSQL_DATABASE=cve
