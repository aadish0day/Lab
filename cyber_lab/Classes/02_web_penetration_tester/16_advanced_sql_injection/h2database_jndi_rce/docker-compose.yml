services:
  h2database:
    image: vulhub/spring-with-h2database:2.0.204
    pull_policy: missing
    container_name: cyberlab_02_h2database
    restart: unless-stopped
    ports:
      - "8184:8080"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=h2database-rce"
