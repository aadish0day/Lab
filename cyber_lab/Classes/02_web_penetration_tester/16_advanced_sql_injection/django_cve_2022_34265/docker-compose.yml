services:
  django:
    container_name: cyberlab_02_django_34265_app
    image: vulhub/django:4.0.5
    pull_policy: missing
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8238:8000"
    depends_on:
      - db
    command: bash /app/docker-entrypoint.sh

  db:
    container_name: cyberlab_02_django_34265_db
    image: postgres:13-alpine
    pull_policy: missing
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CVE_2022_34265
