services:
  cmsms:
    container_name: cyberlab_02_cmsms_app
    image: vulhub/cmsms:2.2.9.1
    pull_policy: missing
    ports:
      - "8259:80"
    depends_on:
      - db

  db:
    container_name: cyberlab_02_cmsms_db
    image: mysql:5.7
    pull_policy: missing
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=cmsms
