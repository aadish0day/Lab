version: "3.8"

services:
  solr:
    image: vulhub/solr:8.1.1
    pull_policy: missing
    container_name: cyberlab_02_solr_dataimport
    restart: unless-stopped
    ports:
      - "8216:8983"
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=solr-dataimport-rce"
