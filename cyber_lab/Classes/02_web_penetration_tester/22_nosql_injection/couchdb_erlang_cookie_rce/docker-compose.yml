services:
  couchdb:
    image: vulhub/couchdb:3.2.1
    pull_policy: missing
    container_name: cyberlab_02_couchdb_cookie
    restart: unless-stopped
    ports:
      - "8199:5984"
    environment:
      - COUCHDB_USER=vulhub
      - COUCHDB_PASSWORD=vulhub
    deploy:
      resources:
        limits:
          memory: 1024m
    labels:
      - "cyberlab.managed=true"
      - "cyberlab.category=practice-target"
      - "cyberlab.shortcut=couchdb-cookie-rce"
