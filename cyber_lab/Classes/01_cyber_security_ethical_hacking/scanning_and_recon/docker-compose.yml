services:
  web:
    image: vulnerables/cve-2014-6271:latest
    pull_policy: missing
    container_name: cyberlab_01_recon_web
    ports:
      - "8081:80"
    restart: unless-stopped

  ssh:
    image: vulhub/openssh:7.7
    pull_policy: missing
    container_name: cyberlab_01_recon_ssh
    ports:
      - "2222:22"
    restart: unless-stopped

  ftp:
    image: delfer/alpine-ftp-server:latest
    pull_policy: missing
    container_name: cyberlab_01_recon_ftp
    environment:
      - USERS=recon|password
      - ADDRESS=127.0.0.1
    ports:
      - "2121:21"
      - "21000-21010:21000-21010"
    restart: unless-stopped
